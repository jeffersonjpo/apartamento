<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#09111f;color:#dde6f5;min-height:100vh;display:flex;overflow-x:hidden}
:root{--bg:#09111f;--bg2:#0f1b2d;--bg3:#152238;--card:#1a2740;--card2:#1f304d;--card3:#253659;--border:#2a3f60;--border2:#334d73;--gold:#e9b84c;--gold2:#f5cd74;--blue:#4d90f0;--blue2:#6aaeff;--green:#3dd68c;--green2:#6feaac;--red:#f47370;--red2:#f9a09e;--orange:#fc9a42;--purple:#b38af8;--text:#dde6f5;--text2:#8baac8;--text3:#4a6585;--r:12px;--r2:7px;--shadow:0 8px 32px rgba(0,0,0,.45)}
#sidebar{width:220px;min-height:100vh;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:100}
.slogo{padding:20px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}

.ltitle{font-size:16px;font-weight:800;color:var(--gold);line-height:1.2}
.lsub{font-size:10px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase}
.navmenu{list-style:none;padding:12px 8px;flex:1;display:flex;flex-direction:column;gap:2px}
.nbtn{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--r2);color:var(--text2);font-size:13px;font-weight:500;transition:all .14s;border:none;background:none;width:100%;text-align:left;cursor:pointer}
.nbtn:hover{background:var(--bg3);color:var(--text)}
.nbtn.active{background:rgba(233,184,76,.13);color:var(--gold);border-left:2px solid var(--gold);padding-left:9px}
.nbtn svg{width:15px;height:15px;flex-shrink:0;opacity:.8}
.nbtn.active svg{opacity:1}
.sfooter{padding:12px 14px;border-top:1px solid var(--border);font-size:10px;color:var(--text3);text-align:center;line-height:1.6}
#main{margin-left:220px;flex:1;padding:24px 28px}
.phead{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;gap:14px}
.ptitle{font-size:21px;font-weight:800;letter-spacing:-.03em}
.psub{font-size:12px;color:var(--text2);margin-top:3px}

.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 15px;border-radius:var(--r2);font-weight:600;font-size:12.5px;border:none;transition:all .14s;line-height:1;cursor:pointer;font-family:inherit}

.bico{padding:5px;border-radius:var(--r2);background:none;border:1px solid var(--border);color:var(--text2);display:inline-flex;align-items:center;transition:all .12s;cursor:pointer;font-size:13px}

.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;margin-bottom:22px}
.scard{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px 17px;transition:border-color .14s}
.scard:hover{border-color:var(--border2)}
.sico{font-size:17px;margin-bottom:7px}
.slbl{font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:500;letter-spacing:.02em}
.sval{font-size:20px;font-weight:800;line-height:1;letter-spacing:-.02em}
.ssub{font-size:10.5px;color:var(--text3);margin-top:4px}
.c-g{color:var(--green)}.c-r{color:var(--red)}.c-gold{color:var(--gold)}.c-b{color:var(--blue2)}.c-pu{color:var(--purple)}.c-or{color:var(--orange)}
.pwrap{background:var(--bg3);border-radius:100px;overflow:hidden}
.pfill{height:100%;border-radius:100px;background:linear-gradient(90deg,var(--gold),var(--orange));transition:width .6s}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:16px}
.ctitle{font-size:13px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:7px}
.twrap{background:var(--card);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:16px}
.tbar{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--border);flex-wrap:wrap;background:var(--bg3)}

.sbox input{background:none;border:none;outline:none;color:var(--text);width:100%;font-size:12px}

table{width:100%;border-collapse:collapse}
thead tr{background:var(--bg3)}
th{padding:9px 12px;text-align:left;font-size:10px;font-weight:700;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;border-bottom:1px solid var(--border)}
td{padding:9px 12px;font-size:12.5px;border-bottom:1px solid rgba(42,63,96,.4)}

.tr{text-align:right}.tc{text-align:center}

.b-iptu{background:rgba(244,115,112,.15);color:#f79a97}

.b-outros{background:rgba(139,170,200,.15);color:#8baac8}

.flbl{display:block;font-size:10.5px;font-weight:700;color:var(--text2);margin-bottom:4px;letter-spacing:.04em;text-transform:uppercase}

.fhint{font-size:10px;color:var(--text3);margin-top:3px}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:11px}

#modal{background:var(--card);border:1px solid var(--border2);border-radius:13px;width:100%;max-width:500px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow)}

.mt{font-size:14px;font-weight:800}

.mb{padding:20px}
.mf{display:flex;justify-content:flex-end;gap:9px;padding:13px 20px;border-top:1px solid var(--border)}

.cctitle{font-size:13px;font-weight:700;margin-bottom:13px}

.leg{display:flex;flex-wrap:wrap;gap:9px;margin-top:9px}
.li{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text2)}
.ld{width:10px;height:10px;border-radius:3px;flex-shrink:0}

.ai{background:rgba(77,144,240,.1);border:1px solid rgba(77,144,240,.3);color:var(--blue2)}
.aw{background:rgba(252,154,66,.1);border:1px solid rgba(252,154,66,.3);color:var(--orange)}
.as{background:rgba(61,214,140,.1);border:1px solid rgba(61,214,140,.3);color:var(--green)}
.abox{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:14px;margin-top:13px}
.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.eico{font-size:40px;margin-bottom:9px;opacity:.3}
hr{border:none;border-top:1px solid var(--border);margin:13px 0}
#toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--border2);border-radius:var(--r);padding:10px 16px;font-size:12.5px;color:var(--text);box-shadow:var(--shadow);transform:translateY(100px);opacity:0;transition:all .26s;z-index:2000}
#toast.show{transform:translateY(0);opacity:1}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}

/* ── LOGIN ── */
#loginScreen{position:fixed;inset:0;background:#09111f;display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:0}
#loginScreen.hidden{display:none}
.login-box{background:#1a2740;border:1px solid #2a3f60;border-radius:16px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.login-logo{text-align:center;margin-bottom:28px}
.login-logo .licon{width:56px;height:56px;font-size:26px;margin:0 auto 12px;background:linear-gradient(135deg,#e9b84c,#fc9a42);border-radius:14px;display:flex;align-items:center;justify-content:center}
.login-logo h1{font-size:20px;font-weight:800;color:#e9b84c;margin-bottom:3px}

.login-err{background:rgba(244,115,112,.12);border:1px solid rgba(244,115,112,.35);border-radius:7px;padding:9px 13px;font-size:12px;color:#f79a97;margin-bottom:14px;display:none}
.login-err.show{display:block}
.sync-tag{font-size:10px;color:#4a6585;text-align:center;margin-top:14px}
.sync-tag span{color:#3dd68c}
#logoutBtn{display:none;align-items:center;gap:6px;padding:6px 10px;border-radius:6px;background:rgba(244,115,112,.1);border:1px solid rgba(244,115,112,.3);color:#f79a97;font-size:11.5px;cursor:pointer;font-family:inherit;margin-bottom:6px}

.sync-indicator{font-size:10px;color:#3dd68c;display:none;align-items:center;gap:4px;margin-bottom:4px}
.sync-indicator.show{display:flex}
.sync-dot{width:6px;height:6px;border-radius:50%;background:#3dd68c;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

</head>

// Persist to Firestore
async function persist(){
  try{
    await DOC().set({config:S.config,transacoes:S.transacoes,savedAt:new Date().toISOString()});
  }catch(e){
    // fallback local
    localStorage.setItem('ape104_v3',JSON.stringify({config:S.config,transacoes:S.transacoes,savedAt:new Date().toISOString()}));
    console.warn('Firestore write failed, saved locally:',e.message);
  }
}

async function loadFromFirestore(){
  try{
    const snap = await DOC().get();
    if(snap.exists){
      const d=snap.data();
      S.transacoes=d.transacoes||[];
      S.config=Object.assign({},CFG_PADRAO,d.config||{});
    } else {
      S.config={...CFG_PADRAO};
      S.transacoes=HIST.map(h=>({...h}));
      await persist();
    }
  }catch(e){
    // fallback localStorage
    const raw=localStorage.getItem('ape104_v3');
    if(raw){const d=JSON.parse(raw);S.transacoes=d.transacoes||[];S.config=Object.assign({},CFG_PADRAO,d.config||{});}
    else{S.config={...CFG_PADRAO};S.transacoes=HIST.map(h=>({...h}));}
    console.warn('Firestore read failed, using local data:',e.message);
  }
  render();
}

function init(){
  AUTH.onAuthStateChanged(async user=>{
    if(user){
      document.getElementById('loginScreen').classList.add('hidden');
      document.getElementById('logoutBtn').style.display='flex';
      document.getElementById('syncIndicator').classList.add('show');
      await loadFromFirestore();
    } else {
      document.getElementById('loginScreen').classList.remove('hidden');
      document.getElementById('logoutBtn').style.display='none';
      document.getElementById('syncIndicator').classList.remove('show');
    }
  });
}

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPass').value;
  const errEl=document.getElementById('loginErr');
  const btn=document.getElementById('loginBtn');
  errEl.classList.remove('show');
  if(!email||!pass){errEl.textContent='Preencha e-mail e senha.';errEl.classList.add('show');return;}
  btn.textContent='Entrando…';btn.disabled=true;
  try{
    await AUTH.signInWithEmailAndPassword(email,pass);
  }catch(e){
    let msg='Erro ao entrar. Tente novamente.';
    if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')msg='Senha incorreta.';
    else if(e.code==='auth/user-not-found')msg='Usuário não encontrado.';
    else if(e.code==='auth/too-many-requests')msg='Muitas tentativas. Tente mais tarde.';
    errEl.textContent=msg;errEl.classList.add('show');
    btn.textContent='Entrar';btn.disabled=false;
  }
}

async function doLogout(){
  if(!confirm('Deseja sair da conta?'))return;
  await AUTH.signOut();
}

function stats(){
  const T=S.transacoes;
  let parc=0,amortP=0,amortE=0,alug=0,cond=0,iptu=0,energ=0,manut=0,outr=0,entr=0;
  let prazoAtual=null,prazoRef='';
  T.forEach(t=>{
    const v=t.valor||0;
    if(t.tipo==='parcela')parc+=v;
    else if(t.tipo==='amortizacao'){amortP+=v;amortE+=(t.valorEfetivo||v);}
    else if(t.tipo==='aluguel')alug+=v;
    else if(t.tipo==='condominio')cond+=v;
    else if(t.tipo==='iptu')iptu+=v;
    else if(t.tipo==='energia')energ+=v;
    else if(t.tipo==='manutencao')manut+=v;
    else if(t.tipo==='outros')outr+=v;
    else if(t.tipo==='entrada')entr+=v;
    if(t.prazoRestante!=null&&t.data>prazoRef){prazoAtual=t.prazoRestante;prazoRef=t.data;}
  });
  const prazoIni=S.config.prazoInicial||360;
  const prazoRest=prazoAtual!=null?prazoAtual:prazoIni;
  const mesesPagos=prazoIni-prazoRest;
  const saldo=parseFloat(S.config.saldoDevedorAtual)||0;
  const gastos=cond+iptu+energ+manut+outr;
  const totalDesp=parc+amortP+cond+iptu+energ+manut+outr+entr;
  return{parc,amortP,amortE,alug,cond,iptu,energ,manut,outr,entr,
    prazoRest,prazoIni,mesesPagos,pct:Math.min(100,mesesPagos/prazoIni*100),
    saldo,gastos,totalDesp,saldoLiq:alug-gastos,fundosProprios:totalDesp-alug};
}

function pgLanc(){
  const anos=[...new Set(S.transacoes.map(t=>t.data.substring(0,4)))].sort().reverse();
  const mNomes=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  let list=[...S.transacoes];
  if(S.fTipo!=='todos')list=list.filter(t=>t.tipo===S.fTipo);
  if(S.fAno!=='todos')list=list.filter(t=>t.data.startsWith(S.fAno));
  if(S.fMes!=='todos')list=list.filter(t=>t.data.substring(5,7)===S.fMes);
  if(S.fBusca){const q=S.fBusca.toLowerCase();list=list.filter(t=>t.descricao.toLowerCase().includes(q)||(t.obs||'').toLowerCase().includes(q));}
  list.sort((a,b)=>b.data.localeCompare(a.data));

function simCalc(){
  const val=parseFloat(document.getElementById('simVal')?.value)||0;
  const saldo=parseFloat(document.getElementById('simSaldo')?.value)||stats().saldo;
  const prazo=stats().prazoRest;
  const el=document.getElementById('simRes');if(!el)return;
  if(!val||val<=0){el.innerHTML='';return;}
  const amortMes=saldo/prazo;
  const mRed=Math.floor(val/amortMes);
  const novoPrazo=Math.max(0,prazo-mRed);
  const hoje=new Date();
  const dtN=new Date(hoje);dtN.setMonth(hoje.getMonth()+novoPrazo);
  el.innerHTML=`<div class="abox">
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;text-align:center">
      <div><div style="font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em">Meses Reduzidos</div>
           <div style="font-size:24px;font-weight:800;color:var(--green);margin-top:4px">~${mRed}</div></div>
      <div><div style="font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em">Novo Prazo</div>
           <div style="font-size:24px;font-weight:800;color:var(--blue2);margin-top:4px">${novoPrazo}m</div></div>
      <div><div style="font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em">Nova Quitação</div>
           <div style="font-size:18px;font-weight:800;color:var(--gold);margin-top:4px">${dtN.toLocaleDateString('pt-BR',{month:'short',year:'numeric'})}</div></div>
      <div><div style="font-size:10px;color:var(--text2);text-transform:uppercase;letter-spacing:.05em">Economia</div>

  </div>`;
}

function verResumoAno(){
  const ano=document.getElementById('anoRel')?.value;
  if(!ano)return;
  const T=S.transacoes.filter(t=>t.data.startsWith(ano));
  const meses=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const rows=meses.map((mn,mi)=>{
    const mm=String(mi+1).padStart(2,'0');
    const TM=T.filter(t=>t.data.substring(5,7)===mm);
    const alug=TM.filter(t=>t.tipo==='aluguel').reduce((s,t)=>s+t.valor,0);
    const parc=TM.filter(t=>t.tipo==='parcela').reduce((s,t)=>s+t.valor,0);
    const amort=TM.filter(t=>t.tipo==='amortizacao').reduce((s,t)=>s+t.valor,0);
    const outros=TM.filter(t=>!['aluguel','parcela','amortizacao'].includes(t.tipo)).reduce((s,t)=>s+t.valor,0);
    const saldo=alug-parc-amort-outros;
    if(TM.length===0)return null;
    return{mn,alug,parc,amort,outros,saldo,n:TM.length};
  }).filter(Boolean);
  if(!rows.length){document.getElementById('resumoAno').innerHTML=`<div class="alert aw">Nenhum lançamento em ${ano}</div>`;return;}
  document.getElementById('resumoAno').innerHTML=`<div class="card">
    <div class="ctitle">📆 Resumo ${ano}</div>
    <table><thead><tr><th>Mês</th><th class="tr">Aluguel</th><th class="tr">Parcela</th><th class="tr">Amort.</th><th class="tr">Outros</th><th class="tr">Saldo Mês</th></tr></thead>
    <tbody>${rows.map(r=>`<tr>
      <td style="font-weight:600">${r.mn}</td>
      <td class="tr vc">+${fmt(r.alug)}</td>
      <td class="tr vd">−${fmt(r.parc)}</td>
      <td class="tr" style="color:var(--purple)">−${fmt(r.amort)}</td>
      <td class="tr vd">−${fmt(r.outros)}</td>
      <td class="tr ${r.saldo>=0?'vc':'vd'}" style="font-weight:700">${fmt(r.saldo)}</td>
    </tr>`).join('')}</tbody></table>
  </div>`;
}

  S.config.nomeProp=document.getElementById('cfgNome')?.value||S.config.nomeProp;
  S.config.valorFinanciado=parseFloat(document.getElementById('cfgVF')?.value)||S.config.valorFinanciado;
  S.config.valorEntrada=parseFloat(document.getElementById('cfgVE')?.value)||S.config.valorEntrada;
  S.config.subsidio=parseFloat(document.getElementById('cfgSub')?.value)||0;
  S.config.prazoInicial=parseInt(document.getElementById('cfgPI')?.value)||S.config.prazoInicial;
  S.config.dataContrato=document.getElementById('cfgDC')?.value||S.config.dataContrato;
  S.config.saldoDevedorAtual=parseFloat(document.getElementById('cfgSD')?.value)||S.config.saldoDevedorAtual;
  persist();toast('✅ Configurações salvas!');
}

function resetDados(){
  if(!confirm('Tem certeza? Todos os lançamentos serão removidos e o histórico original será restaurado.'))return;
  S.transacoes=HIST.map(h=>({...h}));
  S.config={...CFG_PADRAO};
  persist();toast('🔄 Dados restaurados!');render();
}

// ─── MODAL ───
function openModal(id){
  S.editId=id||null;
  const t=id?S.transacoes.find(x=>x.id===id):null;
  const prazoAtual=stats().prazoRest;
  document.getElementById('mtitle').textContent=t?'Editar Lançamento':'Novo Lançamento';
  document.getElementById('mbody').innerHTML=`
    <div class="fg"><label class="flbl">Tipo *</label>
      <select class="fc" id="mTipo" onchange="togglePrazoField()">
        ${Object.entries(TIPOS).map(([k,v])=>`<option value="${k}" ${t?.tipo===k?'selected':''}>${v.emoji} ${v.label}</option>`).join('')}
      </select></div>
    <div class="fg"><label class="flbl">Descrição *</label>
      <input class="fc" id="mDesc" value="${t?.descricao||''}" placeholder="Ex: Parcela de Junho/2026"></div>
    <div class="frow2">
      <div class="fg"><label class="flbl">Valor Pago (R$) *</label>
        <input class="fc" type="number" id="mValor" value="${t?.valor||''}" step="0.01" min="0" placeholder="0,00"></div>
      <div class="fg"><label class="flbl">Valor Efetivo (R$)</label>
        <input class="fc" type="number" id="mVE" value="${t?.valorEfetivo||''}" step="0.01" min="0" placeholder="Se diferente do pago">
        <div class="fhint">Para amortizações parcialmente aplicadas</div></div>
    </div>
    <div class="frow2">
      <div class="fg"><label class="flbl">Data *</label>
        <input class="fc" type="date" id="mData" value="${t?.data||new Date().toISOString().split('T')[0]}"></div>
      <div class="fg" id="prazoField"><label class="flbl">Prazo Restante (meses)</label>
        <input class="fc" type="number" id="mPrazo" value="${t?.prazoRestante!=null?t.prazoRestante:''}" placeholder="${prazoAtual}" min="0" max="${S.config.prazoInicial}">
        <div class="fhint">Prazo após este pagamento/amortização</div></div>
    </div>
    <div class="fg"><label class="flbl">Observação</label>
      <input class="fc" id="mObs" value="${t?.obs||''}" placeholder="Notas adicionais"></div>`;
  togglePrazoField();
  document.getElementById('overlay').classList.remove('hidden');
}

function togglePrazoField(){
  const tipo=document.getElementById('mTipo')?.value;
  const el=document.getElementById('prazoField');
  if(el)el.style.opacity=['parcela','amortizacao'].includes(tipo)?'1':'0.35';
}

function closeModal(){document.getElementById('overlay').classList.add('hidden');S.editId=null;}

function saveModal(){
  const tipo=document.getElementById('mTipo')?.value;
  const desc=document.getElementById('mDesc')?.value?.trim();
  const valor=parseFloat(document.getElementById('mValor')?.value);
  const veRaw=document.getElementById('mVE')?.value;
  const valorEfetivo=veRaw?parseFloat(veRaw):valor;
  const data=document.getElementById('mData')?.value;
  const prazoRaw=document.getElementById('mPrazo')?.value;
  const prazoRestante=prazoRaw!==''?parseInt(prazoRaw):null;
  const obs=document.getElementById('mObs')?.value?.trim();
  if(!tipo||!desc||isNaN(valor)||valor<=0||!data){toast('⚠️ Preencha tipo, descrição, valor e data!');return;}
  if(S.editId){
    const i=S.transacoes.findIndex(x=>x.id===S.editId);
    if(i>=0)S.transacoes[i]={...S.transacoes[i],tipo,descricao:desc,valor,valorEfetivo,data,prazoRestante,obs};
  } else {
    S.transacoes.push({id:uid(),tipo,descricao:desc,valor,valorEfetivo,data,prazoRestante,obs});
  }
  persist();closeModal();toast('✅ Lançamento salvo!');render();
}

function delTrans(id){
  const t=S.transacoes.find(x=>x.id===id);
  if(!t||!confirm(`Excluir "${t.descricao}" (${fmt(t.valor)})?`))return;
  S.transacoes=S.transacoes.filter(x=>x.id!==id);
  persist();toast('🗑️ Lançamento excluído!');render();
}

// ─── EXPORT EXCEL (CSV) ───
function exportExcel(){
  const header=['ID','Tipo','Descrição','Valor Pago','Valor Efetivo','Data','Prazo Restante','Observação'];
  const rows=S.transacoes.sort((a,b)=>a.data.localeCompare(b.data)).map(t=>[
    t.id,TIPOS[t.tipo]?.label||t.tipo,t.descricao,t.valor,t.valorEfetivo||t.valor,
    fd(t.data),t.prazoRestante!=null?t.prazoRestante:'',t.obs||''
  ]);
  // BOM for Excel UTF-8
  let csv='\uFEFF';
  csv+='SEP=;\n';
  csv+=[header,...rows].map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(';')).join('\n');
  // Summary sheet data appended as comment block
  const s=stats();
  csv+='\n\n';
  csv+=`"=== RESUMO ==="\n`;
  csv+=`"Saldo Devedor";"${fmt(s.saldo)}"\n`;
  csv+=`"Meses Restantes";"${s.prazoRest}"\n`;
  csv+=`"Total Parcelas";"${fmt(s.parc)}"\n`;
  csv+=`"Total Amortizado";"${fmt(s.amortE)}"\n`;
  csv+=`"Aluguel Recebido";"${fmt(s.alug)}"\n`;
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`Ape104_Cruzeiro_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
  toast('📊 Excel (CSV) exportado!');
}

// ─── IMPORT BACKUP ───
function importBackup(evt){
  const file=evt.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      if(!d.transacoes)throw new Error('Formato inválido');
      if(!confirm(`Importar ${d.transacoes.length} registros? Os dados atuais serão substituídos.`))return;
      S.transacoes=d.transacoes;
      S.config=Object.assign({},CFG_PADRAO,d.config||{});
      persist();toast(`✅ ${d.transacoes.length} registros importados!`);render();
    }catch(err){toast('❌ Arquivo inválido: '+err.message);}
  };
  r.readAsText(file);
  evt.target.value='';
}

// ─── IMPORT CSV ───
function importCSV(evt){
  const file=evt.target.files[0];if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const lines=e.target.result.split('\n').filter(l=>l.trim()&&!l.startsWith('"SEP')&&!l.startsWith('"='));
      const rows=lines.map(l=>l.split(';').map(c=>c.replace(/^"|"$/g,'').replace(/""/g,'"')));
      // Find header row
      const hi=rows.findIndex(r=>r[0]==='ID'||r[0]==='id');
      if(hi<0){toast('❌ CSV sem cabeçalho reconhecido');return;}
      const data=rows.slice(hi+1).filter(r=>r.length>=6&&r[0]);
      let added=0;
      data.forEach(r=>{
        if(!r[0]||S.transacoes.find(t=>t.id===r[0]))return;
        const tipoKey=Object.entries(TIPOS).find(([,v])=>v.label===r[1])?.[0]||'outros';
        const dtParts=r[5].split('/');
        const dt=dtParts.length===3?`${dtParts[2]}-${dtParts[1]}-${dtParts[0]}`:r[5];
        S.transacoes.push({
          id:r[0],tipo:tipoKey,descricao:r[2],
          valor:parseFloat(r[3])||0,valorEfetivo:parseFloat(r[4])||parseFloat(r[3])||0,
          data:dt,prazoRestante:r[6]?parseInt(r[6]):null,obs:r[7]||''
        });
        added++;
      });
      persist();toast(`✅ ${added} novos lançamentos importados!`);render();
    }catch(err){toast('❌ Erro ao importar: '+err.message);}
  };
  r.readAsText(file,'UTF-8');
  evt.target.value='';
}

// ─── TOAST ───
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2800);
}

// ─── CHARTS ───
function drawFluxo(){
  const cv=document.getElementById('cvFluxo');if(!cv)return;
  const ctx=cv.getContext('2d');
  cv.width=cv.offsetWidth*window.devicePixelRatio||600;
  cv.height=cv.offsetHeight*window.devicePixelRatio||170;
  ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
  const W=cv.offsetWidth,H=cv.offsetHeight;

  // Last 12 months
  const hoje=new Date();
  const labels=[],despSer=[],alugSer=[],parcSer=[];
  for(let i=11;i>=0;i--){
    const d=new Date(hoje);d.setMonth(hoje.getMonth()-i);
    const ym=d.toISOString().substring(0,7);
    const mn=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'][d.getMonth()];
    labels.push(mn+' '+String(d.getFullYear()).slice(2));
    const TM=S.transacoes.filter(t=>t.data.startsWith(ym));
    const alug=TM.filter(t=>t.tipo==='aluguel').reduce((s,t)=>s+t.valor,0);
    const parc=TM.filter(t=>t.tipo==='parcela').reduce((s,t)=>s+t.valor,0);
    const desp=TM.filter(t=>t.tipo!=='aluguel'&&t.tipo!=='parcela'&&TIPOS[t.tipo]?.debit).reduce((s,t)=>s+t.valor,0);
    alugSer.push(alug);parcSer.push(parc);despSer.push(desp);
  }
  const allVals=[...despSer,...alugSer,...parcSer];
  const maxV=Math.max(...allVals,1);
  const pad={t:20,r:10,b:30,l:60};
  const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  const bW=cW/labels.length,bIW=bW*0.25;

  ctx.clearRect(0,0,W,H);
  // Grid lines
  for(let i=0;i<=4;i++){
    const y=pad.t+cH-(cH*i/4);
    ctx.strokeStyle='rgba(42,63,96,0.5)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cW,y);ctx.stroke();
    ctx.fillStyle='#4a6585';ctx.font='10px Segoe UI';ctx.textAlign='right';
    ctx.fillText('R$'+Math.round(maxV*i/4/100)*100,pad.l-5,y+4);
  }
  // Bars
  labels.forEach((lbl,i)=>{
    const x=pad.l+i*bW+bW/2;
    const bars=[[despSer[i],'#f47370'],[alugSer[i],'#3dd68c'],[parcSer[i],'#4d90f0']];
    bars.forEach(([v,c],bi)=>{
      const bx=x+(bi-1)*bIW*1.1-bIW/2;
      const bh=(v/maxV)*cH;
      ctx.fillStyle=c;
      ctx.fillRect(bx,pad.t+cH-bh,bIW,bh);
    });
    ctx.fillStyle='#4a6585';ctx.font='9.5px Segoe UI';ctx.textAlign='center';
    ctx.fillText(lbl,x,H-8);
  });
}

function drawPrazoDash(){

}

function drawPrazoHist(id){

function drawPrazoBase(cv){
  const ctx=cv.getContext('2d');
  cv.width=cv.offsetWidth*window.devicePixelRatio||600;
  cv.height=cv.offsetHeight*window.devicePixelRatio||170;
  ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
  const W=cv.offsetWidth,H=cv.offsetHeight;

  const pts=S.transacoes.filter(t=>t.prazoRestante!=null).sort((a,b)=>a.data.localeCompare(b.data));
  if(pts.length<2){
    ctx.fillStyle='#4a6585';ctx.font='13px Segoe UI';ctx.textAlign='center';
    ctx.fillText('Dados insuficientes',W/2,H/2);return;
  }
  const pad={t:20,r:20,b:30,l:55};
  const cW=W-pad.l-pad.r,cH=H-pad.t-pad.b;
  const maxP=Math.max(...pts.map(p=>p.prazoRestante));
  const minP=Math.min(...pts.map(p=>p.prazoRestante));

  ctx.clearRect(0,0,W,H);
  // Grid
  for(let i=0;i<=4;i++){
    const y=pad.t+cH*i/4;
    ctx.strokeStyle='rgba(42,63,96,0.5)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+cW,y);ctx.stroke();
    const v=Math.round(maxP-(maxP-minP)*i/4);
    ctx.fillStyle='#4a6585';ctx.font='10px Segoe UI';ctx.textAlign='right';
    ctx.fillText(v+'m',pad.l-5,y+4);
  }
  // Line
  const grd=ctx.createLinearGradient(0,pad.t,0,pad.t+cH);
  grd.addColorStop(0,'rgba(233,184,76,.25)');grd.addColorStop(1,'rgba(233,184,76,0)');
  ctx.beginPath();
  pts.forEach((p,i)=>{
    const x=pad.l+i/(pts.length-1)*cW;
    const y=pad.t+(1-(p.prazoRestante-minP)/(maxP-minP||1))*cH;
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.strokeStyle='#e9b84c';ctx.lineWidth=2.5;ctx.stroke();
  // Fill
  ctx.lineTo(pad.l+cW,pad.t+cH);ctx.lineTo(pad.l,pad.t+cH);ctx.closePath();
  ctx.fillStyle=grd;ctx.fill();
  // Labels
  const step=Math.max(1,Math.floor(pts.length/6));
  pts.forEach((p,i)=>{
    if(i%step!==0&&i!==pts.length-1)return;
    const x=pad.l+i/(pts.length-1)*cW;
    ctx.fillStyle='#4a6585';ctx.font='9px Segoe UI';ctx.textAlign='center';
    const yr=p.data.substring(0,7).replace('-','/');
    ctx.fillText(yr,x,H-8);
  });
}

function drawBalanco(){
  const cv=document.getElementById('cvBalanco');if(!cv)return;
  const ctx=cv.getContext('2d');
  cv.width=cv.offsetWidth*window.devicePixelRatio||800;
  cv.height=cv.offsetHeight*window.devicePixelRatio||150;
  ctx.scale(window.devicePixelRatio,window.devicePixelRatio);
  const W=cv.offsetWidth,H=cv.offsetHeight;

  const s=stats();
  const invTotal=s.parc+s.amortP+s.entr+s.cond+s.iptu+s.energ+s.manut+s.outr;
  const fundReceb=s.alug;
  const fundProp=Math.max(0,invTotal-fundReceb);

  const bars=[
    {label:'Fundos Recebidos',   value:fundReceb, color:'#3dd68c', bg:'rgba(61,214,140,.13)'},
    {label:'Fundos Próprios',    value:fundProp,  color:'#fc9a42', bg:'rgba(252,154,66,.13)'},
    {label:'Investimento Total', value:invTotal, color:'#4d90f0', bg:'rgba(77,144,240,.13)'},
  ];

  const labelW=160, pad={t:12,r:16,b:12,l:labelW};
  const cW=W-pad.l-pad.r, cH=H-pad.t-pad.b;
  const maxV=Math.max(...bars.map(b=>b.value),1);
  const bGap=14, bH=Math.floor((cH-bGap*(bars.length-1))/bars.length);

  ctx.clearRect(0,0,W,H);

  // Vertical grid lines
  for(let i=0;i<=4;i++){
    const x=pad.l+cW*i/4;
    ctx.strokeStyle='rgba(42,63,96,0.45)';ctx.lineWidth=1;
    ctx.setLineDash([3,3]);
    ctx.beginPath();ctx.moveTo(x,pad.t);ctx.lineTo(x,pad.t+cH);ctx.stroke();
    ctx.setLineDash([]);
    const v=Math.round(maxV*i/4);
    ctx.fillStyle='#4a6585';ctx.font='9.5px Segoe UI';ctx.textAlign='center';
    ctx.fillText('R$'+v.toLocaleString('pt-BR'),x,H-1);
  }

  bars.forEach((b,i)=>{
    const y=pad.t+i*(bH+bGap);
    const barLen=(b.value/maxV)*cW;

    // Label (left side)
    ctx.fillStyle='#8baac8';ctx.font='12px Segoe UI';ctx.textAlign='right';
    ctx.fillText(b.label,pad.l-10,y+bH/2+4);

    // Track background
    ctx.fillStyle=b.bg;
    ctx.beginPath();ctx.roundRect(pad.l,y,cW,bH,5);ctx.fill();

    // Bar fill with gradient
    const grd=ctx.createLinearGradient(pad.l,0,pad.l+barLen,0);
    grd.addColorStop(0,b.color);grd.addColorStop(1,b.color+'99');
    ctx.fillStyle=grd;
    ctx.beginPath();ctx.roundRect(pad.l,y,barLen,bH,5);ctx.fill();

    // Value label inside or after bar
    const valStr=fmt(b.value);
    ctx.font='bold 12px Segoe UI';
    const tw=ctx.measureText(valStr).width;
    const insideThreshold=cW*0.35;
    if(barLen>insideThreshold+tw+12){
      ctx.fillStyle='#fff';ctx.textAlign='right';
      ctx.fillText(valStr,pad.l+barLen-8,y+bH/2+4);
    } else {
      ctx.fillStyle=b.color;ctx.textAlign='left';
      ctx.fillText(valStr,pad.l+barLen+8,y+bH/2+4);
    }
  });
}

window.onload=init;
window.addEventListener('resize',()=>{if(S.pg==='dashboard'){drawFluxo();drawPrazoDash();drawBalanco();}if(S.pg==='financiamento')drawPrazoHist('cvPrazoHist');});
